[project]
name = "weather-viewdata"
version = "0.1.0"
description = "The weather as a Viewdata service, from yr.no and a local place-name index"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "sextile",
    "httpx>=0.27",
]

[project.scripts]
weather-viewdata = "weather_viewdata.__main__:main"

[tool.uv.sources]
sextile = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
