[project]
name = "weather-viewdata"
version = "0.1.3"
description = "The weather as a Viewdata service, from yr.no and a local place-name index"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    #  Depends on the framework as a published release, not a workspace sibling:
    #  this repo is the deployable service, sextile is its library.
    "sextile>=0.1.3,<0.2",
    "httpx>=0.27",
    #  Windows ships no system time-zone database, so zoneinfo needs its own.
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
weather-viewdata = "weather_viewdata.__main__:main"

#  Resolve from public PyPI, not any machine-level private default index: the
#  lock must reference infrastructure the deployment host can reach.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_viewdata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "bump-my-version>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
#  As in the framework: a method is documented when it has something to say
#  beyond its signature or the base it overrides, so D102/D105/D107 are off.
ignore = ["D102", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
#  A test says what it is about in its name; the docstring rules still hold for
#  the ones that carry a docstring.
"tests/**" = ["D1"]

[tool.mypy]
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]

#  Releasing: `uv run bump-my-version bump patch|minor|major` edits the version,
#  commits and tags `v<version>`; the tag drives deployment.
[tool.bumpversion]
current_version = "0.1.3"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump weather-viewdata to {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
