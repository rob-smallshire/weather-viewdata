name: CI

on:
  push:
    branches: [master]
  pull_request:

# NOTE: before this repo is public, pin the actions below to commit SHAs
# rather than moving tags (see the deployment note's security posture).
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The Python version rides in with the repo (.python-version); uv fetches it.
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
