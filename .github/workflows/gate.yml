name: Gate

# The checks CI and Deploy both run, defined once so they cannot drift. Deploy
# calls this on the tagged commit and will not proceed unless it passes.
on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10
        with:
          # The Python version rides in with the repo (.python-version); uv fetches it.
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
